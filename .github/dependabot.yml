# Crimson takes no third-party runtime libraries (ADR 0004), but GitHub Actions
# used in CI are dependencies of the build pipeline and part of the supply
# chain. Actions are pinned to full commit SHAs; Dependabot proposes the bumps
# so the pins stay current instead of silently rotting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "area: build"
      # Action bumps are not something users read about in release notes, and
      # without a category pr-metadata.yml would block every Dependabot PR.
      - "skip-changelog"
    groups:
      github-owned-actions:
        patterns:
          - "actions/*"
          - "github/*"
