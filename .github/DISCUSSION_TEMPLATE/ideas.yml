body:
  - type: markdown
    attributes:
      value: |
        Ideas start here, before they are a concrete proposal. If one gathers
        support it becomes a feature issue, or an RFC if it changes Crimson's
        architecture.

        Found something broken? That is a [bug report](https://github.com/CrimsonMail/crimson/issues/new/choose),
        not an idea.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem rather than a solution — it leaves room for a better answer than the first one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle this today?
      description: A workaround, or how another mail client does it.
  - type: textarea
    id: tradeoffs
    attributes:
      label: What might it cost?
      description: Optional. Complexity, privacy, performance, anything that would argue against it.
