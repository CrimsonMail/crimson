# Crimson issue labels, kept as data so they can be synchronized rather than
# clicked. Applied with scripts/sync-labels.ps1.
#
# Labels describe categories and cross-cutting properties ONLY. There are
# deliberately no `type:`, `priority:` or `status:` labels here — those are
# modelled as organization Issue Types, organization Issue Fields and the
# Crimson Development Project's Status field respectively. Duplicating them as
# labels means two sources of truth that drift.

# --- Area: which subsystem is involved ------------------------------------
- name: "area: networking"
  color: "4A5568"
  description: "TCP, DNS, sockets, byte streams"
- name: "area: tls"
  color: "4A5568"
  description: "Schannel, certificates, hostname verification"
- name: "area: imap"
  color: "4A5568"
  description: "IMAP protocol, tokenizer, parser, sessions"
- name: "area: smtp"
  color: "4A5568"
  description: "SMTP submission and the outbox"
- name: "area: mime"
  color: "4A5568"
  description: "MIME and RFC 5322 parsing"
- name: "area: oauth"
  color: "4A5568"
  description: "OAuth 2.0 flows, PKCE, SASL"
- name: "area: storage"
  color: "4A5568"
  description: "Local store, ESE, blob store, migrations"
- name: "area: sync"
  color: "4A5568"
  description: "Synchronization engine and offline operations"
- name: "area: search"
  color: "4A5568"
  description: "Indexing and query handling"
- name: "area: ui"
  color: "4A5568"
  description: "Win32 shell, Direct2D, DirectWrite"
- name: "area: accessibility"
  color: "4A5568"
  description: "UI Automation, screen readers, keyboard navigation"
- name: "area: security"
  color: "9B1B30"
  description: "Security hardening (not for vulnerability reports)"
- name: "area: build"
  color: "4A5568"
  description: "Build system, CI, toolchain, release tooling"
- name: "area: documentation"
  color: "4A5568"
  description: "Documentation and ADRs"
- name: "area: crash"
  color: "4A5568"
  description: "Crash reports and stability"

